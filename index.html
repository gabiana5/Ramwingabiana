<!DOCTYPE html>
<html>
<head>
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>Student Registration</h1>
  <p>Fill out all fields to complete your enrollment</p>
</div>

<div class="container">

  <div id="errorBox"></div>

  <form id="myForm">

    <h2>Personal Information</h2>

    <div class="row">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="John Ramwin Gabiana">
      </div>
      <div class="field">
        <label>Student ID / LRN</label>
        <input type="text" id="lrn" maxlength="12" placeholder="12 digits">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Institutional Email</label>
        <input type="email" id="schoolEmail" placeholder="name@school.edu.ph">
      </div>
      <div class="field">
        <label>Personal Email</label>
        <input type="email" id="personalEmail" placeholder="name@gmail.com">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Mobile Number</label>
        <input type="tel" id="mobile" pattern="[0-9]{11}" maxlength="11" placeholder="09123456789">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Date of Birth</label>
        <input type="date" id="dob">
        <small id="ageText">Age: --</small>
      </div>
    </div>

    <h2>Academic Information</h2>

    <div class="row">
      <div class="field">
        <label>Degree Program</label>
        <select id="program">
          <option value="">-- Select --</option>
          <option>BS Information Technology</option>
          <option>BS Computer Science</option>
          <option>BS Nursing</option>
          <option>BS Education</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Year Level</label>
        <div class="choices">
          <label><input type="radio" name="year" value="1st Year"> 1st</label>
          <label><input type="radio" name="year" value="2nd Year"> 2nd</label>
          <label><input type="radio" name="year" value="3rd Year"> 3rd</label>
          <label><input type="radio" name="year" value="4th Year"> 4th</label>
        </div>
      </div>
      <div class="field">
        <label>Enrollment Status</label>
        <div class="choices">
          <label><input type="radio" name="status" value="Regular"> Regular</label>
          <label><input type="radio" name="status" value="Irregular"> Irregular</label>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Units to Enroll (3 - 24)</label>
        <input type="number" id="units" min="3" max="24">
      </div>
      <div class="field">
        <label>GPA / GWA (1.00 - 5.00)</label>
        <input type="number" id="gwa" min="1" max="5" step="0.01">
      </div>
    </div>

    <div class="field">
      <label>Laboratory Courses</label>
      <div class="choices">
        <label><input type="checkbox" name="lab" value="Computer Lab"> Computer Lab</label>
        <label><input type="checkbox" name="lab" value="Physics Lab"> Physics Lab</label>
        <label><input type="checkbox" name="lab" value="Chemistry Lab"> Chemistry Lab</label>
      </div>
    </div>

    <h2>Other Details</h2>

    <div class="field">
      <label>Emergency Contact Name</label>
      <input type="text" id="ecName">
    </div>

    <div class="field">
      <label>Photo or Proof of Grades (PNG, JPG, PDF - max 2MB)</label>
      <input type="file" id="file" accept="image/png, image/jpeg, application/pdf">
    </div>

    <div class="field">
      <label>Extracurricular Background / Scholarship Justification</label>
      <textarea id="essay" rows="4"></textarea>
    </div>

    <label class="terms">
      <input type="checkbox" id="terms"> I agree to the university terms and honor code
    </label>

    <button type="submit">Submit Registration</button>
  </form>
</div>

<!-- Modal box -->
<div id="modal">
  <div id="modalContent">
    <h2>Registration Summary</h2>
    <div id="summary"></div>
    <button id="closeBtn">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
